# Monthly update pull requests, grouped per ecosystem so they arrive as a few PRs rather
# than dozens. CI (workflows/ci.yml) runs the tests on each one before it is merged.
# Security fixes are proposed as soon as they are published, whatever the schedule.
version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/backend", "/eval"]
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /ai-service
    schedule:
      interval: monthly
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    ignore:
      # Angular sets the TypeScript versions it supports (@angular/build's peer
      # dependency); TypeScript is moved together with an Angular major, by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/ai-service", "/backend", "/web"]
    schedule:
      interval: monthly
    ignore:
      # A new .NET major also needs TargetFramework and global.json changed, and the SDK
      # and runtime images moved together: a deliberate upgrade, not a monthly bump.
      - dependency-name: dotnet/sdk
        update-types: ["version-update:semver-major"]
      - dependency-name: dotnet/aspnet
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
